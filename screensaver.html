<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk HUD Screensaver</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030305;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px;
      position: relative;
    }
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.3;
    }
    .hud-card {
      z-index: 10;
      background: rgba(13, 14, 22, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 75, 75, 0.25);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 60, 60, 0.15);
      max-width: 480px;
      width: 100%;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 60, 60, 0.15);
      border: 1px solid rgba(255, 60, 60, 0.4);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ff4d4d;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #ff4d4d;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff4d4d;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .title {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #ff6b6b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      color: #8a8f9d;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .time-display {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    .date-display {
      font-size: 16px;
      font-weight: 600;
      color: #ff6b6b;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: #6c727f;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
    }
    .quote-box {
      background: rgba(255, 77, 77, 0.08);
      border-left: 4px solid #ff4d4d;
      padding: 16px 20px;
      border-radius: 0 16px 16px 0;
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      font-style: italic;
      line-height: 1.5;
    }
    .center-logo {
      z-index: 10;
      text-align: center;
    }
    .luffy-icon {
      font-size: 120px;
      filter: drop-shadow(0 0 30px rgba(255, 77, 77, 0.5));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div class="hud-card">
    <div class="badge">
      <div class="pulse-dot"></div>
      STRAWHAT COMMAND // GEAR 5
    </div>
    <div class="title">Mangal Workstation</div>
    <div class="subtitle">Jamshedpur 📍 • Live Automation Engine</div>
    <div class="time-display" id="clock">00:00:00 AM</div>
    <div class="date-display" id="date">LOADING DATE...</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">CPU Load</div>
        <div class="stat-value" id="cpu-val">6%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">RAM Used</div>
        <div class="stat-value" id="ram-val">48%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Battery</div>
        <div class="stat-value" id="bat-val">🔋 92%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Latency</div>
        <div class="stat-value" id="ping-val">⚡ 32ms</div>
      </div>
    </div>

    <div class="quote-box" id="quote">
      "King of the Pirates doesn't break build! ⚓"
    </div>
  </div>

  <div class="center-logo">
    <div class="luffy-icon">🔥</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' });
      
      document.getElementById('clock').textContent = timeStr;
      document.getElementById('date').textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    setInterval(() => {
      document.getElementById('cpu-val').textContent = (Math.floor(Math.random() * 8) + 4) + '%';
      document.getElementById('ping-val').textContent = '⚡ ' + (Math.floor(Math.random() * 20) + 25) + 'ms';
    }, 4000);

    const quotes = [
      '"King of the Pirates doesn\'t break build! ⚓"',
      '"Gear 5 Peak Dev Mode Active 🔥"',
      '"GTM Automation Engine Running 24/7 ⚡"',
      '"Jamshedpur Builder Workstation 📍"'
    ];
    let qIdx = 0;
    setInterval(() => {
      qIdx = (qIdx + 1) % quotes.length;
      document.getElementById('quote').textContent = quotes[qIdx];
    }, 8000);

    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 1,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: (Math.random() - 0.5) * 0.5,
      alpha: Math.random() * 0.5 + 0.2
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 77, 77, ${p.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();
  </script>
</body>
</html>
